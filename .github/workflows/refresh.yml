name: refresh-returns-live

# Runs the التذاكر live refresh every 5 minutes in GitHub's cloud (no PC needed).
# NOTE: GitHub's scheduler is best-effort — runs can be delayed several minutes under load.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:            # lets you trigger a run manually from the Actions tab

concurrency:                    # never let two refreshes overlap
  group: refresh-returns-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run refresh
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SHEETS_CLIENT_EMAIL: ${{ secrets.SHEETS_CLIENT_EMAIL }}
          SHEETS_PRIVATE_KEY: ${{ secrets.SHEETS_PRIVATE_KEY }}
        run: python refresh_live_dates.py
